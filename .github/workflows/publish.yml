name: Publish

# The only thing here that touches the registry, and the only one that cannot
# be undone: npm never allows a version number to be reused, by anyone, ever.
# So it fires on a tag rather than on a push — `version.yml` creates the tag,
# and a human can also create one by hand.
#
# Authentication is **npm Trusted Publishing (OIDC)**: no long-lived token
# exists anywhere, not in this repository's secrets and not on anyone's laptop.
# npm mints a short-lived credential for this exact workflow in this exact
# repository. Two consequences worth knowing before editing this file:
#
#   - Trusted publishing is configured **per package** on npmjs.com, and it
#     names *this file*. Renaming publish.yml, or moving the job, breaks the
#     trust relationship and every publish 403s until the config is updated.
#   - **It cannot perform a package's first publish** — npm has nowhere to
#     attach the trusted publisher until the package exists. cutver 0.1.0 goes
#     out by hand with a local token; everything after comes through here.
#     `cutver` itself refuses to cut a release for a package the registry has
#     never heard of, so this is enforced rather than remembered.
#
# Two triggers, and the second is not a convenience.
#
# **A tag pushed by `version.yml` cannot start this workflow.** GitHub refuses
# to create workflow runs from events made with the default `GITHUB_TOKEN`, to
# prevent recursion — so the `push: tags` trigger only ever fires for a tag a
# human pushes. `workflow_dispatch` is one of the two documented exemptions
# (with `repository_dispatch`), so version.yml calls this explicitly instead.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to publish, e.g. v1.2.3'
        required: true
        type: string

concurrency:
  # Two runs publishing the same tag would race. Never cancel one mid-publish.
  group: publish-${{ github.ref }}
  cancel-in-progress: false

permissions:
  # For the GitHub release the executables are attached to.
  contents: write
  # The whole point. Without it the runner cannot mint the OIDC token and npm
  # falls back to looking for a credential that does not exist — failing with
  # an error about credentials rather than about permissions, which sends you
  # looking for the token trusted publishing exists to not need.
  id-token: write

jobs:
  publish:
    name: npm + executables
    runs-on: ubuntu-latest

    # One name for the tag whichever trigger fired. On a tag push `ref_name` is
    # the tag; on a dispatch it is the branch, so the input has to win.
    env:
      TAG: ${{ inputs.tag || github.ref_name }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # Explicit, because a dispatched run would otherwise check out the
          # branch and publish whatever is on it rather than what was tagged.
          ref: ${{ inputs.tag || github.ref_name }}

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # npm does the publishing, so it needs a Node it supports. The runner's
      # bundled npm predates OIDC support often enough that pinning is cheaper
      # than debugging a 401 that claims to be about permissions.
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Use an npm that speaks OIDC
        run: |
          npm install -g npm@latest
          npm --version

      - run: bun install --frozen-lockfile

      # A tag can be created by hand, and by hand it can be put on the wrong
      # commit. Publishing then ships whatever the manifest happens to say
      # under a tag claiming something else — and both are permanent.
      - name: Refuse if the tag and the manifest disagree
        run: |
          manifest=$(bun -e 'console.log(require("./package.json").version)')
          if [ "v$manifest" != "$TAG" ]; then
            echo "tag $TAG does not match the manifest version $manifest" >&2
            exit 1
          fi
          echo "tag and manifest agree on $manifest"

      # Run again rather than trusted from the tagged commit's earlier run: a
      # tag can be moved, a branch force-pushed. Last point anything stops.
      - run: bun run typecheck
      # **`bun run test`, not `bun test`.** The script carries `--timeout
      # 30000`, and the suite needs it: a dozen tests spawn git or a cutver
      # subprocess and land within a second of bun's 5s default. Calling
      # `bun test` directly here bypassed the one place that number is
      # configured, so CI ran with a limit the project had already decided was
      # wrong — a flake that only ever appeared under load.
      - run: bun run test

      # The dist-tag is derived from the version, never passed in. **A
      # prerelease published without one becomes `latest`**, and then every
      # plain `bunx cutver` in the world resolves to a beta — silently, and
      # only fixable by re-tagging after people have installed it. An
      # unrecognised prerelease is refused rather than defaulted.
      - name: Work out the dist-tag
        id: disttag
        run: |
          version="${TAG#v}"
          case "$version" in
            *-alpha.*) tag=alpha ;;
            *-beta.*)  tag=beta ;;
            *-rc.*)    tag=rc ;;
            *-*)       echo "unrecognised prerelease in $version" >&2; exit 1 ;;
            *)         tag=latest ;;
          esac
          echo "value=$tag" >> "$GITHUB_OUTPUT"
          echo "publishing $version under dist-tag $tag"

      # **Idempotent on purpose.** The tag for release one is pushed *after*
      # that release has already gone out by hand — it has to be, because
      # trusted publishing cannot create the package — and a human-pushed tag
      # does fire this workflow. npm would refuse the duplicate anyway;
      # refusing it earlier keeps the run green, which matters because a
      # workflow that is red for a known-fine reason is one nobody reads.
      - name: Already on the registry?
        id: exists
        run: |
          version="${TAG#v}"
          if curl -fsS -o /dev/null "https://registry.npmjs.org/cutver/$version"; then
            echo "value=true" >> "$GITHUB_OUTPUT"
            echo "cutver@$version is already published — skipping the publish"
          else
            echo "value=false" >> "$GITHUB_OUTPUT"
          fi

      # **Before the publish, because the tarball is one of the outputs.**
      # `bin` points at `dist/cutver.mjs` — the bundle Node runs, since the
      # source is TypeScript against Bun — and `dist/` is gitignored, so a
      # checkout has nothing there until this step. Publishing first would ship
      # a package whose `bin` names a file that is not in it.
      #
      # The five executables come from the same step: a repository with no
      # package manager — a Rust workspace, say — should not have to install one
      # to cut a version.
      - name: Build the bundle and every executable
        run: bun run build --all

      - name: Refuse to publish a tarball with no entry point
        run: |
          test -s dist/cutver.mjs
          head -1 dist/cutver.mjs | grep -qx '#!/usr/bin/env node'

          # **`// @bun` must not survive the build.** Bun's fast path for that
          # pragma decodes the source as latin1 on every platform, so non-ASCII
          # character in a string literal ships mangled — an em-dash as
          # `c3 a2 c2 80 c2 94` — in the help, in every error, and in the
          # headings this writes into other people's changelogs. The build
          # strips it; this refuses to publish if that ever stops working.
          if grep -qx '// @bun' dist/cutver.mjs; then
            echo "dist/cutver.mjs still has the // @bun pragma" >&2
            exit 1
          fi

          # **Asked of Bun, not of node.** To real Node `// @bun` is an inert
          # line comment and the loader reads UTF-8 regardless, so running this
          # under node passes on a corrupted bundle and guards nothing. Bun is
          # what decodes it wrongly, so Bun is what has to be asked.
          bun dist/cutver.mjs help | head -1 | grep -q $'\xe2\x80\x94'
          echo "dist/cutver.mjs: node shebang, no @bun pragma, UTF-8 intact"

      # Same idempotency, for the same reason: a re-run must not die on a
      # release that already exists. Binaries are uploaded either way, so a
      # partial run can be finished by running it again.
      # The body comes from CHANGELOG.md, through cutver's own `notes`, rather
      # than from `--generate-notes`. GitHub's version is a list of commit
      # subjects and merged pull requests — the thing this project spends its
      # changelog arguing is a downgrade — so using it here was cutver not
      # eating its own cooking. `|| true`: notes are never worth failing a
      # release that is already tagged and built.
      # `summarizer:` in cutver.yml names the provider; the key is deliberately
      # not in that file, so it arrives here. An unset secret is not a failure —
      # cutver says so on stderr and publishes the compiled notes.
      #
      # **The checkout, not `bunx cutver`, and only in this repository.** A
      # generated workflow is right to call the published tool: it picks up
      # improvements without anyone regenerating a file. Here that is backwards.
      # cutver's own config is always one release ahead of the published cutver,
      # so `bunx cutver` reads a `cutver.yml` written for a version that does not
      # exist yet and dies on an unknown key — measured, with cutver@1.2.0
      # answering `unknown key changelog` against the config in this tree.
      #
      # A stable release scrapes past it, because this step runs after the npm
      # publish and `latest` has just become the version being released. A
      # prerelease does not: it publishes under its own dist-tag, so `latest`
      # stays behind and the step fails into `|| true` and an empty notes.md.
      # The release body then silently becomes "_No release notes._".
      #
      # Notes for version X belong to version X's code, and it is already
      # checked out and installed.
      - name: Release notes
        timeout-minutes: 15
        continue-on-error: true
        env:
          CUTVER_SUMMARIZE_KEY: ${{ secrets.CUTVER_SUMMARIZE_KEY }}
        run: bun run cutver notes "$TAG" > notes.md || true

      # Both kinds, matching `artifacts:` in cutver.yml: the five executables
      # for a machine with no JavaScript runtime, and the bundle for one that
      # has Node but no package manager — `curl` it and `node cutver.mjs`.
      # The globs are disjoint; `cutver-*` cannot match `cutver.mjs`.
      - name: Attach the executables and the bundle to the release
        env:
          GH_TOKEN: ${{ github.token }}
          PRERELEASE: ${{ steps.disttag.outputs.value == 'latest' && ' ' || '--prerelease' }}
        run: |
          [ -s notes.md ] || echo "_No release notes._" > notes.md
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/cutver.mjs dist/cutver-* --clobber
            gh release edit "$TAG" --notes-file notes.md
          else
            gh release create "$TAG" dist/cutver.mjs dist/cutver-* --title "$TAG" --notes-file notes.md $PRERELEASE
          fi

      - name: Publish to npm
        if: steps.exists.outputs.value != 'true'
        env:
          DIST_TAG: ${{ steps.disttag.outputs.value }}
        run: npm publish --tag "$DIST_TAG"

      - name: Summary
        env:
          DIST_TAG: ${{ steps.disttag.outputs.value }}
        run: |
          {
            echo "### Published $TAG under \`$DIST_TAG\`"
            echo
            echo "Authenticated by OIDC — no token was used."
            echo
            echo '```'
            if [ "$DIST_TAG" = latest ]; then
              echo 'bunx cutver stage --dry-run'
            else
              echo "bunx cutver@$DIST_TAG stage --dry-run"
            fi
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
