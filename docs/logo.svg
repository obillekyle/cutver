<svg xmlns="http://www.w3.org/2000/svg" width="340" height="340" viewBox="78 81.4 340 340" fill="none">
  <title>cutver</title>
  <!--
    The blades only, and no scalloped frame: this is the copy the docs header
    and favicon use, where the frame does not survive either theme. It is white,
    so on the light site it disappears into the page and on the dark one it is a
    white blob around a small mark. The README keeps the framed version, which
    is the one sitting on a GitHub page rather than inside a header bar.

    The viewBox is the old clip rect, so the blades fill the box instead of
    floating in the space the frame used to occupy.
  -->
  <style>
    /*
      The scissors only. The scalloped badge is the frame and holds still; the
      subject is what moves.

      **The wrapper is outside the clip on purpose.** The blades live inside a
      340x340 `clip-path`, and rotating within it would shear the corners off
      as they swept past the square. Rotating the clipped group instead carries
      the clip along, so nothing is ever newly clipped.

      Counter-clockwise is a decreasing angle: 180deg -> 0. Half a turn rather
      than a full one — a whole revolution reads as a loading spinner, and this
      is an entrance. `both` holds the start frame before it plays and the end
      frame after, so there is no flash of the un-transformed state on a slow
      load.
    */
    .spin {
      transform-origin: 248px 251.4px;
      animation: cutver-in 900ms cubic-bezier(.2, .8, .2, 1) both;
    }
    @keyframes cutver-in {
      from { opacity: 0; transform: rotate(180deg) scale(.5); }
      to   { opacity: 1; transform: rotate(0deg) scale(1); }
    }
    /* Somebody who has asked their system for less motion gets the end state. */
    @media (prefers-reduced-motion: reduce) {
      .spin { animation: none; opacity: 1; }
    }
  </style><g class="spin"><g clip-path="url(#b)"><path fill="#45a6ff" d="M172 241.7c-3.6.1-7.4-.2-9.4-1.5s-4.4-5.2-6.9-8.3a44 44 0 0 0-50-13.8A42.5 42.5 0 0 0 81 273.4a43.5 43.5 0 0 0 79.9 2c.7-1.7 1.1-2.6 2.4-3.9s4-2 6-2.4a90 90 0 0 1 31.3-1.3l1.5-4L210 242c-10.2 0-25-.7-38-.3m-42 37.7a23.5 23.5 0 0 1-30.3-13.1 23 23 0 0 1 13.3-30c12-4.5 25.6 1.3 30.3 13.2a23 23 0 0 1-13.3 29.9m287.5-85.6c-2.6-6.5-10.4-7.2-29.8-2.2-10.5 2.6-59 17-101.3 29.7L276.3 273A8299 8299 0 0 0 397 215.2c17.6-9.3 23-15 20.4-21.4"/><path fill="#295d8d" d="M280.2 342.4c-3.4-2.1-7.6-4-9.2-6-1.5-1.8-2.2-5.5-2.5-9-1.3-17.5-5-38-4.6-46.2 0 0 29.8-151 32.8-170.5 3-19.6 1.4-27.1-5.3-29-6.8-1.8-12 4-19.6 22.3A13467 13467 0 0 0 212 267.2s34.5 13.5 29.2 65.7a13 13 0 0 1-1.8 6.1c-1.2 1.4-2 2-3.7 2.8a42.6 42.6 0 0 0 10.4 78c23 6.3 46.9-7 53.2-29.8 5.2-18.7-3.1-38-19.1-47.6m-40.4-74.9a8 8 0 0 1-5.7-9.9 8 8 0 0 1 10-5.6 8 8 0 1 1-4.3 15.5m40.3 117.3a23.4 23.4 0 0 1-28.8 16.2 23 23 0 0 1-16.4-28.4 23.4 23.4 0 0 1 45.2 12.2"/></g></g><defs><clipPath id="b"><path fill="#fff" d="M78 81.4h340v340H78z"/></clipPath></defs></svg>