<svg xmlns="http://www.w3.org/2000/svg" width="497" height="503" viewBox="0 0 497 503" fill="none">
  <style>
    /*
      The scissors only. The scalloped badge is the frame and holds still; the
      subject is what moves.

      **The wrapper is outside the clip on purpose.** The blades live inside a
      340x340 `clip-path`, and rotating within it would shear the corners off
      as they swept past the square. Rotating the clipped group instead carries
      the clip along, so nothing is ever newly clipped.

      Counter-clockwise is a decreasing angle: 180deg -> 0. Half a turn rather
      than a full one — a whole revolution reads as a loading spinner, and this
      is an entrance. `both` holds the start frame before it plays and the end
      frame after, so there is no flash of the un-transformed state on a slow
      load.
    */
    .spin {
      transform-origin: 248px 251.4px;
      animation: cutver-in 900ms cubic-bezier(.2, .8, .2, 1) both;
    }
    @keyframes cutver-in {
      from { opacity: 0; transform: rotate(180deg) scale(.5); }
      to   { opacity: 1; transform: rotate(0deg) scale(1); }
    }
    /* Somebody who has asked their system for less motion gets the end state. */
    @media (prefers-reduced-motion: reduce) {
      .spin { animation: none; opacity: 1; }
    }
